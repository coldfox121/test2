<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <meta name="robots" content="noindex">
  <title>故事页</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    try {
      var savedTheme = localStorage.getItem('story.theme');
      if (savedTheme && savedTheme !== 'amber') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>故事页</h1>
        <p>这里需要专属链接才能进入</p>
      </div>
      <p class="auth-hint">请向分享者索取完整访问地址。</p>
    </div>
  </div>
  <script src="/js/theme.js?v=1"></script>
</body>
</html>
