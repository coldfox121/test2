<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <title>雾亭站 · 文字冒险</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <rect x="8" y="40" width="48" height="4" rx="2" fill="#3a332a"/>
            <rect x="14" y="16" width="4" height="24" fill="#3a332a"/>
            <rect x="46" y="16" width="4" height="24" fill="#3a332a"/>
            <rect x="10" y="12" width="44" height="8" rx="2" fill="#5b5145"/>
            <circle cx="32" cy="30" r="5" fill="#d9a441" opacity=".9"/>
            <circle cx="32" cy="30" r="9" fill="#d9a441" opacity=".2"/>
          </svg>
        </div>
        <h1>雾亭站</h1>
        <p>文字冒险 · 多结局</p>
      </div>

      <div id="cloudAuth" hidden>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">注册</button>
        </div>
        <form id="authForm">
          <label class="field">
            <span>账号</span>
            <input id="authUser" name="username" type="text" autocomplete="username" maxlength="16"
                   placeholder="3-16 位字母、数字或下划线" required>
          </label>
          <label class="field">
            <span>密码</span>
            <input id="authPass" name="password" type="password" autocomplete="current-password"
                   minlength="6" maxlength="64" placeholder="至少 6 位" required>
          </label>
          <p id="authError" class="form-error" role="alert"></p>
          <button id="authSubmit" type="submit" class="btn-primary">登录</button>
        </form>
        <p class="auth-hint">云端账号：换设备登录可继续游戏进度。</p>
        <button id="cloudGuestBtn" type="button" class="btn-text">暂不登录，本地试玩</button>
      </div>

      <div id="localAuth" hidden>
        <p id="localNotice" class="auth-note">当前环境未接入云后端，为本地试玩模式。存档只保存在本机浏览器中。</p>
        <button id="guestBtn" type="button" class="btn-primary">进入本地试玩</button>
        <p class="auth-hint">部署到 Cloudflare Pages 后自动启用云端账号，无需额外配置。</p>
      </div>
    </div>
    <p class="auth-foot">test2 · 文字冒险游戏</p>
  </div>

  <!-- 主游戏界面（唯一常驻页面） -->
  <div id="gameScreen" class="game-screen" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">雾亭站</span>
        <span id="userTag" class="user-tag"></span>
      </div>

      <nav class="topbar-actions" aria-label="功能入口">
        <button type="button" class="btn-ghost" data-modal="collection">图鉴</button>
        <button type="button" class="btn-ghost" data-modal="settings">设置</button>
      </nav>
    </header>

    <main class="game-main">
      <figure class="scene-frame">
        <img id="sceneImg" alt="场景画面">
      </figure>

      <article id="storyText" class="story-text"></article>

      <div id="choices" class="choices"></div>

      <section id="endingPanel" class="ending-panel" hidden>
        <span id="endingTone" class="ending-tone"></span>
        <h2 id="endingTitle" class="ending-title"></h2>
        <div class="ending-actions">
          <button id="restartBtn" type="button" class="btn-primary">重新开始</button>
          <button id="endingCollectionBtn" type="button" class="btn-secondary">查看图鉴</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 通用浮层窗口：可关闭，不可拖动 -->
  <div id="modalLayer" class="modal-layer" hidden>
    <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" type="button" class="modal-close" aria-label="关闭">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/story.js?v=1"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
